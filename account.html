
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Koko's Talk account and start learning Salvadoran Sign Language (LESSA).">
    <meta name="author" content="Koko's Talk">
    <title>Create Your Account - Koko's Talk</title>

    <link rel="icon" type="image/png" href="img/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/account.css">
</head>
<body>
    <a href="#" class="return-btn" aria-label="Return to previous page">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Return</span>
    </a>

    <main class="main-container">
        <div class="form-wrapper">
            <div class="decorative-circles">
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
            </div>

            <div class="form-content">
                <h1 class="form-title">Create your account</h1>

                <form id="registerForm" class="register-form" novalidate>
                    <div class="input-group">
                        <label class="input-label" for="name">Name</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                            <input type="text" id="name" class="form-input" placeholder="e.g. John Doe" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="username">Username</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="4"/>
                                    <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>
                                </svg>
                            </div>
                            <input type="text" id="username" class="form-input" placeholder="e.g. user123" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="email">Email</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                                </svg>
                            </div>
                            <input type="email" id="email" class="form-input" placeholder="example@email.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="password">Password</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </div>
                            <input type="password" id="password" class="form-input" placeholder="Create a password" required minlength="6">
                            <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon hidden">
                                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                    <line x1="2" x2="22" y1="2" y2="22"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="confirmPassword">Confirm password</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </div>
                            <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm password" required minlength="6">
                            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon hidden">
                                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                    <line x1="2" x2="22" y1="2" y2="22"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="create-account-btn">Create account</button>
                </form>
            </div>

            <div class="decorative-arrows">
                <div class="arrow"></div>
                <div class="arrow"></div>
                <div class="arrow"></div>
                <div class="arrow"></div>
                <div class="arrow"></div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Alternar visibilidad de contraseña
            const toggleButtons = document.querySelectorAll('.toggle-password');
            toggleButtons.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (!input) return;

                    // Cambiar tipo de input y los iconos 
                    const isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';

                    const eyeIcon = this.querySelector('.eye-icon');
                    const eyeOffIcon = this.querySelector('.eye-off-icon');
                    if (eyeIcon) eyeIcon.classList.toggle('hidden', isPassword);
                    if (eyeOffIcon) eyeOffIcon.classList.toggle('hidden', !isPassword);

                    const label = isPassword ? 'Hide password' : 'Show password';
                    this.setAttribute('aria-label', label);
                });
            });

            // Validación y envío del formulario
            const form = document.getElementById('registerForm');
            form.addEventListener('submit', function (e) {
                e.preventDefault();

                const name = document.getElementById('name').value.trim();
                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // Limpiar estilos de error anteriores
                clearErrors();

                let valid = true;

                if (!name) {
                    showError('name', 'Name is required.');
                    valid = false;
                }
                if (!username) {
                    showError('username', 'Username is required.');
                    valid = false;
                }
                if (!email || !isValidEmail(email)) {
                    showError('email', 'Enter a valid email address.');
                    valid = false;
                }
                if (password.length < 6) {
                    showError('password', 'Password must be at least 6 characters.');
                    valid = false;
                }
                if (password !== confirmPassword) {
                    showError('confirmPassword', 'Passwords do not match.');
                    valid = false;
                }

                if (!valid) return;

                // Simulación de registro exitoso
                alert('✅ Account created successfully! Welcome to Koko\'s Talk.');
                form.reset();

                // También reseteamos los iconos de visibilidad si algún campo quedó type="text"
                toggleButtons.forEach(function (btn) {
                    const targetId = btn.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (input && input.type === 'text') {
                        input.type = 'password';
                        const eyeIcon = btn.querySelector('.eye-icon');
                        const eyeOffIcon = btn.querySelector('.eye-off-icon');
                        if (eyeIcon) eyeIcon.classList.remove('hidden');
                        if (eyeOffIcon) eyeOffIcon.classList.add('hidden');
                        btn.setAttribute('aria-label', 'Show password');
                    }
                });
            });

            function showError(fieldId, message) {
                const input = document.getElementById(fieldId);
                const group = input.closest('.input-group');
                if (!group) return;

                // Remover mensaje previo si existe
                const existing = group.querySelector('.error-message');
                if (existing) existing.remove();

                const errorSpan = document.createElement('span');
                errorSpan.className = 'error-message';
                errorSpan.textContent = message;
                group.appendChild(errorSpan);
                input.classList.add('input-error');
            }

            function clearErrors() {
                document.querySelectorAll('.error-message').forEach(function (el) {
                    el.remove();
                });
                document.querySelectorAll('.input-error').forEach(function (el) {
                    el.classList.remove('input-error');
                });
            }

            function isValidEmail(email) {
                // Validación básica de formato de email
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }
        });
    </script>
</body>
</html>
